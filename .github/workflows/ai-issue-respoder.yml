name: AI Issue & Comment Responder

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  ai-respond:
    # Игнорируем комментарии от самого бота, чтобы не было бесконечного цикла
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      # 1. Скачиваем весь код репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Настраиваем Python окружение
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Устанавливаем библиотеку для работы с ИИ
      - name: Install dependencies
        run: pip install openai

      # 4. Запускаем нашего умного ИИ-агента
      - name: Run AI Responder Script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Передаем контекст: текст вопроса, тип события и ссылку на него
          EVENT_TYPE: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          QUESTION_BODY: ${{ github.event.comment.body || github.event.issue.body }}
          QUESTION_TITLE: ${{ github.event.issue.title }}
        run: python .github/scripts/ai_responder.py
