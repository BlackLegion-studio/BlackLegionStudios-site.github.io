name: GitHub AI Issue Responder

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  ai-respond:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Нам понадобится библиотека azure-ai-inference для работы с моделями GitHub
      - name: Set up Python and Install dependencies
        run: |
          sudo apt-get update
          python3 -m pip install azure-ai-inference

      - name: Run GitHub AI Responder
        env:
          # Используем встроенный токен GitHub, ничего настраивать не нужно!
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_TYPE: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          QUESTION_BODY: ${{ github.event.comment.body || github.event.issue.body }}
          QUESTION_TITLE: ${{ github.event.issue.title }}
        run: python3 .github/scripts/ai_responder.py
