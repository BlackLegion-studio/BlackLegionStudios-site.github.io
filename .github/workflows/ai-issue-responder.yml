name: GitHub AI Issue Responder

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  ai-respond:
    # Защита: не отвечаем самим себе и другим ботам
    if: |
      github.actor != 'github-actions[bot]' && 
      github.actor != 'github-actions'
    runs-on: ubuntu-latest
    steps:
      # 1. Скачиваем код репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Запускаем встроенный скрипт
      - name: Run GitHub AI Responder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          QUESTION_BODY: ${{ github.event.comment.body || github.event.issue.body }}
          QUESTION_TITLE: ${{ github.event.issue.title }}
        run: python3 .github/scripts/ai_responder.py
